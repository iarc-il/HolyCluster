global:
  scrape_interval: 30s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
  - job_name: collector
    metrics_path: /metrics
    static_configs:
      - targets: [collector:9101]
  - job_name: coverage
    metrics_path: /metrics
    static_configs:
      - targets: [coverage:9102]
