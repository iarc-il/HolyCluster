name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME to holycluster-backend-dev or holycluster-backend-prod}

services:
  postgres:
    build:
      context: infra/postgres
      dockerfile: Dockerfile.postgres
    restart: unless-stopped
    ports:
      # This is for local development only,
      # It's OK to expose these ports on the server because they are accessible only from localhost.
      - "127.0.0.1:15432:5432"
    env_file:
      - .env
    volumes:
      - ./infra/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
        - TZ=Asia/Jerusalem
    expose:
      - "${POSTGRES_PORT}"

  valkey:
    build:
      context: infra/valkey
      dockerfile: Dockerfile.valkey
    # Mount a volume for data persistence (optional, but recommended)
    # volumes:
    #   - valkey_data:/data
    environment:
    # Password needs to be passed to the healthcheck command
      - VALKEY_PASSWORD=${VALKEY_PASSWORD}
    ports:
      # This is for local development only,
      # It's OK to expose these ports on the server because they are accessible only from localhost.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s # Grace period for Valkey to start up
    restart: always

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  collector:
    build:
      context: .
      dockerfile: docker/Dockerfile.collector
      additional_contexts:
        - band_plans=../shared
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      COLLECTOR_METRICS_PORT: ${COLLECTOR_METRICS_PORT:-9101}
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['COLLECTOR_METRICS_PORT'] + '/metrics', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ${LOG_DIR}:${LOG_DIR}
    expose:
      - "${VALKEY_PORT}"
    cap_add:
      - SYS_PTRACE

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    working_dir: /app
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    volumes:
      - ${UI_DIST_PATH}:${UI_DIST_PATH}
      - ${CATSERVER_MSI_DIR}:${CATSERVER_MSI_DIR}
      - ${LOG_DIR}:${LOG_DIR}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 5s

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.126.0
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=${VM_RETENTION_PERIOD:-30d}
      - -storage.minFreeDiskSpaceBytes=${VM_MIN_FREE_DISK_SPACE_BYTES:-3000000000}
      - -promscrape.config=/etc/victoriametrics/scrape.yml
    volumes:
      - ./infra/monitoring/victoriametrics/data:/storage
      - ./infra/monitoring/victoriametrics/scrape.yml:/etc/victoriametrics/scrape.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8428/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:12.3.1
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ -z "$${GF_SECURITY_ADMIN_PASSWORD}" ]; then
          echo 'Set GRAFANA_ADMIN_PASSWORD before starting Grafana.' >&2
          exit 1
        fi
        exec /run.sh
    # The bind mount is created on the host; Grafana runs as UID 472.
    user: "472:472"
    environment:
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
    volumes:
      - ./infra/monitoring/grafana/data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    build:
      context: infra/nginx
      dockerfile: Dockerfile.nginx
    # Mirrors the CMD in Dockerfile.nginx (envsubst + nginx), but adds a
    # background loop that reloads nginx only when the cert on disk changes.
    # certbot renews the cert in a separate container and can't reload this
    # one; checking the fullchain mtime every 6h means we reload on renewal
    # (~monthly) instead of unconditionally, which avoids leaving lingering
    # "shutting down" workers holding open websocket connections.
    # Keep the envsubst/nginx parts in sync with Dockerfile.nginx CMD.
    command:
      - /bin/sh
      - -c
      - |
        (
          last=$$(stat -c %Y /etc/letsencrypt/live/$${DOMAIN}/fullchain.pem /etc/letsencrypt/live/$${DOMAIN_ALT}/fullchain.pem /etc/letsencrypt/live/$${GLITCHTIP_DOMAIN}/fullchain.pem 2>/dev/null)
          while :; do
            sleep 6h & wait $${!}
            cur=$$(stat -c %Y /etc/letsencrypt/live/$${DOMAIN}/fullchain.pem /etc/letsencrypt/live/$${DOMAIN_ALT}/fullchain.pem /etc/letsencrypt/live/$${GLITCHTIP_DOMAIN}/fullchain.pem 2>/dev/null)
            [ "$$cur" != "$$last" ] && { nginx -s reload; last=$$cur; }
          done
        ) &
        envsubst '$${DOMAIN} $${DOMAIN_ALT} $${GLITCHTIP_DOMAIN}' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf
        [ -n "$${DOMAIN_ALT}" ] && envsubst '$${DOMAIN_ALT}' < /etc/nginx/nginx-alt.conf.template > /etc/nginx/conf.d/alt.conf
        rm -f /etc/nginx/conf.d/glitchtip.conf
        [ -n "$${GLITCHTIP_DOMAIN}" ] && envsubst '$${DOMAIN} $${GLITCHTIP_DOMAIN}' < /etc/nginx/nginx-glitchtip.conf.template > /etc/nginx/conf.d/glitchtip.conf
        nginx -g 'daemon off;'
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "80:80"
      - "443:443"
      - "9999:9999"
    volumes:
      - ./infra/certbot/conf:/etc/letsencrypt
      - ./infra/certbot/www:/var/www/certbot
      - ./infra/nginx/log:/var/log/nginx
      - ./infra/nginx:/etc/nginx
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "service", "nginx", "status"]
      interval: 5s
      timeout: 5s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - proxy

  certbot:
    restart: unless-stopped
    # Renews all issued certs via webroot http-01 (each renewal.conf records
    # authenticator=webroot). The DOMAIN_ALT challenge reaches
    # the box through the Cloudflare proxy (zone has Always-Use-HTTPS off), so no
    # Cloudflare credential is needed on this server. The nginx reload-watch loop
    # picks up renewed certs.
    image: certbot/certbot:latest
    volumes:
      - ./infra/certbot/conf:/etc/letsencrypt
      - ./infra/certbot/www:/var/www/certbot
      - ./infra/certbot/log:/var/log
    entrypoint: >
      /bin/sh -c 'trap exit TERM; while :; do sleep 6h & wait $${!}; certbot renew; done'

  nginx_ui:
      profiles: ["dev"]
      stdin_open: true
      tty: true
      image: uozi/nginx-ui:latest
      restart: unless-stopped
      ports:
        - "8080:80"
        - "8443:443"
      volumes:
        - infra/nginx:/etc/nginx
        - infra/nginx-ui:/etc/nginx-ui
        - infra/certbot/conf:/etc/letsencrypt
        - /var/run/docker.sock:/var/run/docker.sock
      environment:
        - TZ=Asia/Jerusalem

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-holycluster-proxy}
