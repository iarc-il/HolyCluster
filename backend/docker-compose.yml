services:
  postgres:
    build:
      context: infra/postgres
      dockerfile: Dockerfile.postgres
    restart: unless-stopped
    ports:
      # This is for local development only,
      # It's OK to expose these ports on the server because they are accessible only from localhost.
      - "127.0.0.1:15432:5432"
    env_file:
      - .env
    volumes:
      - ./infra/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
        - TZ=Asia/Jerusalem
    expose:
      - "${POSTGRES_PORT}"

  valkey:
    build:
      context: infra/valkey
      dockerfile: Dockerfile.valkey
    # Mount a volume for data persistence (optional, but recommended)
    # volumes:
    #   - valkey_data:/data
    environment:
    # Password needs to be passed to the healthcheck command
      - VALKEY_PASSWORD=${VALKEY_PASSWORD}
    ports:
      # This is for local development only,
      # It's OK to expose these ports on the server because they are accessible only from localhost.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s # Grace period for Valkey to start up
    restart: always

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  collector:
    build:
      context: .
      dockerfile: docker/Dockerfile.collector
      additional_contexts:
        - band_plans=../shared
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    volumes:
      - ${LOG_DIR}:${LOG_DIR}
    expose:
      - "${VALKEY_PORT}"
    cap_add:
      - SYS_PTRACE

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    working_dir: /app
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    volumes:
      - ${UI_DIST_PATH}:${UI_DIST_PATH}
      - ${CATSERVER_MSI_DIR}:${CATSERVER_MSI_DIR}
      - ${LOG_DIR}:${LOG_DIR}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 5s

  monitor:
    build:
      context: .
      dockerfile: docker/Dockerfile.monitor
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  nginx:
    build:
      context: infra/nginx
      dockerfile: Dockerfile.nginx
    # Mirrors the CMD in Dockerfile.nginx (envsubst + nginx), but adds a
    # background loop that reloads nginx only when the cert on disk changes.
    # certbot renews the cert in a separate container and can't reload this
    # one; checking the fullchain mtime every 6h means we reload on renewal
    # (~monthly) instead of unconditionally, which avoids leaving lingering
    # "shutting down" workers holding open websocket connections.
    # Keep the envsubst/nginx parts in sync with Dockerfile.nginx CMD.
    command:
      - /bin/sh
      - -c
      - |
        (
          last=$$(stat -c %Y /etc/letsencrypt/live/$${DOMAIN}/fullchain.pem /etc/letsencrypt/live/$${DOMAIN_ALT}/fullchain.pem 2>/dev/null)
          while :; do
            sleep 6h & wait $${!}
            cur=$$(stat -c %Y /etc/letsencrypt/live/$${DOMAIN}/fullchain.pem /etc/letsencrypt/live/$${DOMAIN_ALT}/fullchain.pem 2>/dev/null)
            [ "$$cur" != "$$last" ] && { nginx -s reload; last=$$cur; }
          done
        ) &
        envsubst '$${DOMAIN} $${DOMAIN_ALT}' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf
        [ -n "$${DOMAIN_ALT}" ] && envsubst '$${DOMAIN_ALT}' < /etc/nginx/nginx-alt.conf.template > /etc/nginx/conf.d/alt.conf
        nginx -g 'daemon off;'
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "80:80"
      - "443:443"
      - "9999:9999"
    volumes:
      - ./infra/certbot/conf:/etc/letsencrypt
      - ./infra/certbot/www:/var/www/certbot
      - ./infra/nginx/log:/var/log/nginx
      - ./infra/nginx:/etc/nginx
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "service", "nginx", "status"]
      interval: 5s
      timeout: 5s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"

  certbot:
    restart: unless-stopped
    # Renews BOTH the DOMAIN and DOMAIN_ALT certs via webroot http-01 (each cert's
    # renewal.conf records authenticator=webroot). The DOMAIN_ALT challenge reaches
    # the box through the Cloudflare proxy (zone has Always-Use-HTTPS off), so no
    # Cloudflare credential is needed on this server. The nginx reload-watch loop
    # picks up renewed certs.
    image: certbot/certbot:latest
    volumes:
      - ./infra/certbot/conf:/etc/letsencrypt
      - ./infra/certbot/www:/var/www/certbot
      - ./infra/certbot/log:/var/log
    entrypoint: >
      /bin/sh -c 'trap exit TERM; while :; do sleep 6h & wait $${!}; certbot renew; done'

  nginx_ui:
      profiles: ["dev"]
      stdin_open: true
      tty: true
      image: uozi/nginx-ui:latest
      restart: unless-stopped
      ports:
        - "8080:80"
        - "8443:443"
      volumes:
        - infra/nginx:/etc/nginx
        - infra/nginx-ui:/etc/nginx-ui
        - infra/certbot/conf:/etc/letsencrypt
        - /var/run/docker.sock:/var/run/docker.sock
      environment:
        - TZ=Asia/Jerusalem
