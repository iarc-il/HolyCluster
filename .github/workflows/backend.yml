name: Build and Deploy Backend

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - "scripts/ci_ssh.sh"
    branches:
      - "dev"
      - "int"
    tags:
      - "backend-v*"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - "scripts/ci_ssh.sh"
    branches:
      - "dev"
      - "int"

permissions:
  contents: read

jobs:
  build-and-deploy-backend:
    name: Lint and Deploy Backend
    runs-on: [self-hosted, Linux, X64]
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/int' || startsWith(github.ref, 'refs/tags/backend-v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Ruff linting
        working-directory: backend
        run: uv run ruff check .

      - name: Run Ruff formatting check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Verify migration history
        working-directory: backend
        run: test "$(uv run alembic heads | wc -l)" -eq 1

      - name: Run tests
        working-directory: backend
        env:
          LOG_DIR: ${{ runner.temp }}/holy
          UI_DIST_PATH: ${{ runner.temp }}/ui
          SENTRY_ENVIRONMENT: dev
          SENTRY_RELEASE: test
        run: |
          cp .env.example .env
          mkdir -p "$UI_DIST_PATH/assets"
          uv run pytest

      - name: Setup SSH
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/int' || startsWith(github.ref, 'refs/tags/backend-v')
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: scripts/ci_ssh.sh "${{ secrets.DEPLOY_HOST_DEV }}" "${{ secrets.DEPLOY_HOST_INT }}" "${{ secrets.DEPLOY_HOST_PROD }}"

      - name: Deploy to Development Server
        if: github.ref == 'refs/heads/dev'
        run: |
          ssh ${{ secrets.DEPLOY_USER_DEV }}@${{ secrets.DEPLOY_HOST_DEV }} \
            "cd ${{ secrets.REPO_ROOT_DEV }} && git fetch && git checkout origin/dev -- backend/deploy.sh && cd backend && bash deploy.sh origin/dev"

      - name: Deploy to Integration Server
        if: github.ref == 'refs/heads/int'
        run: |
          ssh ${{ secrets.DEPLOY_USER_INT }}@${{ secrets.DEPLOY_HOST_INT }} \
            "cd ${{ secrets.REPO_ROOT_INT }} && git fetch && git checkout origin/int -- backend/deploy.sh && cd backend && bash deploy.sh origin/int"

      - name: Deploy to Production Server
        if: startsWith(github.ref, 'refs/tags/backend-v')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          ssh ${{ secrets.DEPLOY_USER_PROD }}@${{ secrets.DEPLOY_HOST_PROD }} \
            "cd ${{ secrets.REPO_ROOT_PROD }} && git fetch --tags && git checkout $TAG -- backend/deploy.sh && cd backend && bash deploy.sh $TAG"

      - name: Remove deployment credentials
        if: always() && env.SSH_AGENT_PID != ''
        run: ssh-agent -k
