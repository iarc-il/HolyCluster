name: Build and Deploy Backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
    branches:
      - "dev"
    tags:
      - "backend-v*"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
    branches:
      - "dev"

jobs:
  build-and-deploy-backend:
    name: Lint and Deploy Backend
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/backend-v')
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: holy_cluster
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d holy_cluster"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Ruff linting
        working-directory: backend
        run: uv run ruff check .

      - name: Run Ruff formatting check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Run database migrations
        working-directory: backend
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB_NAME: holy_cluster
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_HOST_LOCAL: localhost
          POSTGRES_PORT_LOCAL: 5432
        run: uv run alembic upgrade head

      - name: Run tests
        working-directory: backend
        env:
          LOG_DIR: ${{ runner.temp }}/holy
          UI_DIST_PATH: ${{ runner.temp }}/ui
        run: |
          cp .env.example .env
          mkdir -p "$UI_DIST_PATH/assets"
          uv run pytest

      - name: Setup SSH
        if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/backend-v')
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST_DEV }} >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST_PROD }} >> ~/.ssh/known_hosts

      - name: Deploy to Development Server
        if: github.ref == 'refs/heads/dev'
        run: |
          ssh ${{ secrets.DEPLOY_USER_DEV }}@${{ secrets.DEPLOY_HOST_DEV }} \
            "cd ${{ secrets.REPO_ROOT_DEV }} && git fetch && git checkout origin/dev -- backend/deploy.sh && cd backend && bash deploy.sh origin/dev"

      - name: Deploy to Production Server
        if: startsWith(github.ref, 'refs/tags/backend-v')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          ssh ${{ secrets.DEPLOY_USER_PROD }}@${{ secrets.DEPLOY_HOST_PROD }} \
            "cd ${{ secrets.REPO_ROOT_PROD }} && git fetch --tags && git checkout $TAG -- backend/deploy.sh && cd backend && bash deploy.sh $TAG"
