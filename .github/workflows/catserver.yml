name: Build and upload catserve

on:
  push:
    paths:
      - "catserver/**"
      - "backend/shared/artifact-validator/**"
      - "backend/shared/src/shared/artifact_validation.py"
      - ".github/workflows/catserver.yml"
    branches:
      - "dev"
    tags:
      - "catserver-v*"
  pull_request:
    paths:
      - "catserver/**"
      - "backend/shared/artifact-validator/**"
      - "backend/shared/src/shared/artifact_validation.py"
      - ".github/workflows/catserver.yml"
    branches:
      - "dev"

env:
  CARGO_TARGET_DIR: target
  TARGET: x86_64-pc-windows-gnu
  # Checkout can rewrite annotated tags; use the triggering tag for releases.
  CATSERVER_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
  CATSERVER_SENTRY_ENVIRONMENT: ${{ github.ref == 'refs/heads/dev' && 'dev' || github.ref_type == 'tag' && 'prod' || 'dev' }}
  # Development builds favor CI speed; production tags keep maximum optimization.
  CARGO_PROFILE_RELEASE_LTO: ${{ github.ref_type == 'tag' && 'true' || 'false' }}
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ github.ref_type == 'tag' && '1' || '16' }}
  CARGO_INCREMENTAL: "0"
  TZ: UTC
  LC_ALL: C.UTF-8
  ZERO_AR_DATE: "1"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

concurrency:
  group: catserver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-catserver:
    name: Test Catserver
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/iarc-il/catserver-ci@sha256:4ce4424867da6695955f291277c04ac0155e8d006a1323cbf922ab4c29506117
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: ${{ runner.os }}-cargo-${{ env.TARGET }}-${{ hashFiles('catserver/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.TARGET }}-

      - name: Cache Hamlib source and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            catserver/${{ env.CARGO_TARGET_DIR }}/hamlib-src
            catserver/${{ env.CARGO_TARGET_DIR }}/**/build/hamlib-src-*/out
          key: ${{ runner.os }}-hamlib-static-${{ env.TARGET }}-${{ hashFiles('catserver/Cargo.lock', 'catserver/Cargo.toml', 'catserver/.cargo/config.toml', 'catserver/Dockerfile', 'catserver/build.rs', 'catserver/crates/hamlib-src/**') }}

      - name: Fix git errors
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --tags --force

      - name: Run rustfmt
        working-directory: catserver
        run: cargo fmt --check

      - name: Run host workspace tests
        working-directory: catserver
        run: cargo test --workspace

      - name: Test and build package inspector
        working-directory: backend/shared/artifact-validator
        run: |
          cargo test --locked
          cargo build --release --locked
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      - name: Run Python tests
        working-directory: catserver
        run: python3 -m unittest discover -s . -p 'test_*.py'

  lint-catserver:
    name: Lint Catserver
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/iarc-il/catserver-ci@sha256:4ce4424867da6695955f291277c04ac0155e8d006a1323cbf922ab4c29506117
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: ${{ runner.os }}-cargo-${{ env.TARGET }}-${{ hashFiles('catserver/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.TARGET }}-

      - name: Cache Hamlib source and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            catserver/${{ env.CARGO_TARGET_DIR }}/hamlib-src
            catserver/${{ env.CARGO_TARGET_DIR }}/**/build/hamlib-src-*/out
          key: ${{ runner.os }}-hamlib-static-${{ env.TARGET }}-${{ hashFiles('catserver/Cargo.lock', 'catserver/Cargo.toml', 'catserver/.cargo/config.toml', 'catserver/Dockerfile', 'catserver/build.rs', 'catserver/crates/hamlib-src/**') }}

      - name: Fix git errors
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --tags --force

      - name: Run Clippy
        working-directory: catserver
        run: cargo clippy --workspace --target $TARGET -- -D warnings

  build-linux:
    name: Build Linux Catserver
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/iarc-il/catserver-ci@sha256:4ce4424867da6695955f291277c04ac0155e8d006a1323cbf922ab4c29506117
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: ${{ runner.os }}-cargo-${{ env.TARGET }}-${{ hashFiles('catserver/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.TARGET }}-

      - name: Cache Hamlib source and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            catserver/${{ env.CARGO_TARGET_DIR }}/hamlib-src
            catserver/${{ env.CARGO_TARGET_DIR }}/**/build/hamlib-src-*/out
          key: ${{ runner.os }}-hamlib-static-${{ env.TARGET }}-${{ hashFiles('catserver/Cargo.lock', 'catserver/Cargo.toml', 'catserver/.cargo/config.toml', 'catserver/Dockerfile', 'catserver/build.rs', 'catserver/crates/hamlib-src/**') }}

      - name: Fix git errors
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --tags --force

      - name: Set reproducible build metadata
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)" >> "$GITHUB_ENV"
          echo "CATSERVER_VERSION=${CATSERVER_VERSION:-$(git describe --match 'catserver-v*')}" >> "$GITHUB_ENV"

      - name: Build Linux release binary
        working-directory: catserver
        run: cargo build --workspace --target x86_64-unknown-linux-gnu --release --locked

      - name: Build Linux AppImage
        working-directory: catserver
        run: sh ./build_appimage.sh

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: HolyCluster-linux-x86_64
          path: catserver/target/x86_64-unknown-linux-gnu/release/catserver-v*-linux-x86_64.AppImage

  build-windows:
    name: Build Windows Catserver
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/iarc-il/catserver-ci@sha256:4ce4424867da6695955f291277c04ac0155e8d006a1323cbf922ab4c29506117
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: ${{ runner.os }}-cargo-${{ env.TARGET }}-${{ hashFiles('catserver/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.TARGET }}-

      - name: Cache Hamlib source and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            catserver/${{ env.CARGO_TARGET_DIR }}/hamlib-src
            catserver/${{ env.CARGO_TARGET_DIR }}/**/build/hamlib-src-*/out
          key: ${{ runner.os }}-hamlib-static-${{ env.TARGET }}-${{ hashFiles('catserver/Cargo.lock', 'catserver/Cargo.toml', 'catserver/.cargo/config.toml', 'catserver/Dockerfile', 'catserver/build.rs', 'catserver/crates/hamlib-src/**') }}

      - name: Fix git errors
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --tags --force

      - name: Set reproducible build metadata
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)" >> "$GITHUB_ENV"
          echo "CATSERVER_VERSION=${CATSERVER_VERSION:-$(git describe --match 'catserver-v*')}" >> "$GITHUB_ENV"

      - name: Build static catserver
        working-directory: catserver
        shell: bash
        run: |
          SOURCE_ROOT=$(pwd -P)
          export CFLAGS="${CFLAGS:+$CFLAGS }-ffile-prefix-map=$SOURCE_ROOT=/src"
          export CXXFLAGS="${CXXFLAGS:+$CXXFLAGS }-ffile-prefix-map=$SOURCE_ROOT=/src"
          # Cargo merges this array with the static flags in .cargo/config.toml.
          # Caller RUSTFLAGS/CARGO_ENCODED_RUSTFLAGS retain Cargo's precedence.
          RUST_CONFIG=$(python3 -c 'import json, os; print("target.x86_64-pc-windows-gnu.rustflags = " + json.dumps(["--remap-path-prefix=" + os.getcwd() + "=/src"]))')
          cargo build --workspace --target "$TARGET" --release --locked --config "$RUST_CONFIG"

      - name: Reject non-system DLL imports
        working-directory: catserver
        run: |
          imports=$(x86_64-w64-mingw32-objdump -p target/$TARGET/release/catserver.exe | awk '/DLL Name:/ { print tolower($3) }')
          for dll in $imports; do
            case "$dll" in
              advapi32.dll|bcrypt.dll|bcryptprimitives.dll|cfgmgr32.dll|combase.dll|comctl32.dll|comdlg32.dll|crypt32.dll|dwmapi.dll|gdi32.dll|hid.dll|imm32.dll|iphlpapi.dll|kernel32.dll|kernelbase.dll|mpr.dll|msvcrt.dll|ncrypt.dll|ntdll.dll|ole32.dll|oleaut32.dll|propsys.dll|rpcrt4.dll|secur32.dll|setupapi.dll|shell32.dll|shlwapi.dll|user32.dll|uxtheme.dll|userenv.dll|uuid.dll|version.dll|winhttp.dll|winmm.dll|winspool.drv|winusb.dll|ws2_32.dll|wtsapi32.dll|api-ms-win-*.dll|ext-ms-win-*.dll) ;;
              *) echo "non-system DLL import: $dll" >&2; exit 1 ;;
            esac
          done

      - name: Change build artifacts ownership
        working-directory: catserver
        run: chown -R wix:wix target

      - name: Build installer
        working-directory: catserver
        run: su wix -c "./build_msi.sh in-docker --default-shortcut-arguments '${DEFAULT_SHORTCUT_ARGUMENTS}'"
        env:
          DEFAULT_SHORTCUT_ARGUMENTS: ${{ github.ref == 'refs/heads/dev' && '--dev-server' || '' }}

      - name: Upload Windows MSI
        if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: HolyCluster-windows-x86_64
          path: catserver/target/${{ env.TARGET }}/release/HolyCluster.msi

  inspect-candidate-packages:
    name: Inspect staged release packages
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ""
    outputs:
      version: ${{ steps.inspect.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v4
        with:
          name: HolyCluster-linux-x86_64
          path: candidate/linux
      - uses: actions/download-artifact@v4
        with:
          name: HolyCluster-windows-x86_64
          path: candidate/windows
      - name: Build read-only package inspector
        working-directory: backend/shared/artifact-validator
        run: cargo build --release --locked
      - name: Inspect exact candidate bytes before installation
        id: inspect
        run: |
          VERSION="${CATSERVER_VERSION:-$(git describe --match 'catserver-v*')}"
          VALIDATOR=backend/shared/artifact-validator/target/release/holy-artifact-validator
          "$VALIDATOR" windows "$VERSION" candidate/windows/HolyCluster.msi
          "$VALIDATOR" linux "$VERSION" "candidate/linux/$VERSION-linux-x86_64.AppImage"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          printf 'commit=%s run=%s version=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$VERSION" | tee candidate/inspection.txt
          sha256sum candidate/windows/HolyCluster.msi "candidate/linux/$VERSION-linux-x86_64.AppImage" | tee -a candidate/inspection.txt
          wc -c candidate/windows/HolyCluster.msi "candidate/linux/$VERSION-linux-x86_64.AppImage" | tee -a candidate/inspection.txt
      - name: Preserve candidate inspection results
        uses: actions/upload-artifact@v4
        with:
          name: Candidate-package-inspection
          path: candidate/inspection.txt

  smoke-windows-release:
    name: Install candidate MSI and verify browser downloads
    needs: inspect-candidate-packages
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HolyCluster-linux-x86_64
          path: candidate/linux
      - uses: actions/download-artifact@v4
        with:
          name: HolyCluster-windows-x86_64
          path: candidate/windows
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install browser test tools
        working-directory: ui
        run: |
          npm ci
          npx playwright install chromium firefox
      - name: Install and exercise the actual MSI
        shell: pwsh
        run: |
          ./.github/scripts/catserver_windows_smoke.ps1 `
            -Msi candidate/windows/HolyCluster.msi `
            -AppImage "candidate/linux/${{ needs.inspect-candidate-packages.outputs.version }}-linux-x86_64.AppImage" `
            -Version "${{ needs.inspect-candidate-packages.outputs.version }}"
      - name: Preserve installer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-release-guardrail-logs
          path: ${{ runner.temp }}/HolyCluster-release-smoke/*.log
          if-no-files-found: ignore

  smoke-linux-release:
    name: Start candidate AppImage and verify browser downloads
    needs: inspect-candidate-packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CATSERVER_SMOKE_VERSION: ${{ needs.inspect-candidate-packages.outputs.version }}
      CATSERVER_SMOKE_MSI: ${{ github.workspace }}/candidate/windows/HolyCluster.msi
      CATSERVER_SMOKE_APPIMAGE: ${{ github.workspace }}/candidate/linux/${{ needs.inspect-candidate-packages.outputs.version }}-linux-x86_64.AppImage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HolyCluster-linux-x86_64
          path: candidate/linux
      - uses: actions/download-artifact@v4
        with:
          name: HolyCluster-windows-x86_64
          path: candidate/windows
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install browser test tools
        working-directory: ui
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox
      - name: Extract the inspected AppImage without FUSE
        run: |
          mkdir -p "$RUNNER_TEMP/holy-appimage-smoke"
          cd "$RUNNER_TEMP/holy-appimage-smoke"
          chmod +x "$CATSERVER_SMOKE_APPIMAGE"
          "$CATSERVER_SMOKE_APPIMAGE" --appimage-extract
          echo "CATSERVER_SMOKE_EXE=$PWD/squashfs-root/AppRun" >> "$GITHUB_ENV"
          echo "CATSERVER_SMOKE_EXPECT_VERSION=$(printf '%s' "$CATSERVER_SMOKE_VERSION" | sed -E 's/^catserver-v//; s/-g[0-9a-f]+$//')" >> "$GITHUB_ENV"
      - name: Exercise the actual AppImage payload
        run: xvfb-run -a node ui/scripts/release_browser_smoke.mjs

  publish-catserver:
    name: Publish Catserver
    if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')
    needs: [test-catserver, lint-catserver, build-linux, build-windows, inspect-candidate-packages, smoke-windows-release, smoke-linux-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: HolyCluster-linux-x86_64
          path: catserver/target/x86_64-unknown-linux-gnu/release

      - name: Download Windows MSI
        uses: actions/download-artifact@v4
        with:
          name: HolyCluster-windows-x86_64
          path: catserver/target/${{ env.TARGET }}/release

      - name: Build package inspector
        working-directory: backend/shared/artifact-validator
        env:
          RUSTC_WRAPPER: ""
        run: |
          cargo build --release --locked
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      - name: Inspect candidate packages before deployment access
        env:
          RUSTC_WRAPPER: ""
        run: |
          VERSION="${CATSERVER_VERSION:-$(git describe --match 'catserver-v*')}"
          holy-artifact-validator windows "$VERSION" "catserver/target/$TARGET/release/HolyCluster.msi"
          holy-artifact-validator linux "$VERSION" "catserver/target/x86_64-unknown-linux-gnu/release/$VERSION-linux-x86_64.AppImage"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST_DEV }}" >> ~/.ssh/known_hosts
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST_PROD }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload to Development Server
        if: github.ref == 'refs/heads/dev'
        run: |
          VERSION="${CATSERVER_VERSION:-$(git describe --match 'catserver-v*')}"
          python3 catserver/publish.py \
            --deploy-user ${{ secrets.DEPLOY_USER_DEV }} \
            --deploy-host ${{ secrets.DEPLOY_HOST_DEV }} \
            --remote-artifact-dir /opt/msi \
            --version "$VERSION" \
            --artifact "windows:x86_64:catserver/target/$TARGET/release/HolyCluster.msi:$VERSION-windows-x86_64.msi" \
            --artifact "linux:x86_64:catserver/target/x86_64-unknown-linux-gnu/release/$VERSION-linux-x86_64.AppImage:$VERSION-linux-x86_64.AppImage"

      - name: Upload to Production Server
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${CATSERVER_VERSION:-$(git describe --match 'catserver-v*')}"
          python3 catserver/publish.py \
            --deploy-user ${{ secrets.DEPLOY_USER_PROD }} \
            --deploy-host ${{ secrets.DEPLOY_HOST_PROD }} \
            --remote-artifact-dir /opt/msi \
            --version "$VERSION" \
            --artifact "windows:x86_64:catserver/target/$TARGET/release/HolyCluster.msi:$VERSION-windows-x86_64.msi" \
            --artifact "linux:x86_64:catserver/target/x86_64-unknown-linux-gnu/release/$VERSION-linux-x86_64.AppImage:$VERSION-linux-x86_64.AppImage"

      - name: Verify promoted public downloads
        env:
          RELEASE_VERSION: ${{ needs.inspect-candidate-packages.outputs.version }}
          RELEASE_ORIGIN: ${{ github.ref == 'refs/heads/dev' && 'https://holycluster-dev.iarc.org' || 'https://holycluster.iarc.org' }}
        run: |
          for platform in windows linux; do
            if [ "$platform" = windows ]; then
              name="$RELEASE_VERSION-windows-x86_64.msi"
              source="catserver/target/$TARGET/release/HolyCluster.msi"
            else
              name="$RELEASE_VERSION-linux-x86_64.AppImage"
              source="catserver/target/x86_64-unknown-linux-gnu/release/$name"
            fi
            expected=$(sha256sum "$source" | cut -d ' ' -f 1)
            downloaded="$RUNNER_TEMP/verified-$name"
            curl --fail --proto '=https' --connect-timeout 10 --max-time 120 --max-filesize 536870912 \
              --header 'Cache-Control: no-cache' --header 'Accept-Encoding: identity' \
              "$RELEASE_ORIGIN/catserver/artifacts/$name?download_policy=2&sha256=$expected" --output "$downloaded"
            printf '%s  %s\n' "$expected" "$downloaded" | sha256sum --check -
            holy-artifact-validator "$platform" "$RELEASE_VERSION" "$downloaded"
          done
