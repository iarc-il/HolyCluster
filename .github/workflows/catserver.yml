name: Build and upload catserve

on:
  push:
    paths:
      - "catserver/**"
      - ".github/workflows/catserver.yml"
    branches:
      - "dev"
    tags:
      - "catserver-v*"
  pull_request:
    paths:
      - "catserver/**"
      - ".github/workflows/catserver.yml"
    branches:
      - "dev"

env:
  CARGO_TARGET_DIR: target
  HAMLIB_SHA256: ae1fcf2dbc80ea0786ea8f047b09399c3f7737d1930442f61a031708ed33e88f
  HAMLIB_VERSION: 4.7.2
  HAMLIB_LIBUSB_INCLUDE_DIR: /opt/hamlib-libusb/x86_64-w64-mingw32/include
  HAMLIB_LIBUSB_LIB_DIR: /opt/hamlib-libusb/x86_64-w64-mingw32/lib
  LIBUSB_SHA256: fea36f34f9156400209595e300840767ab1a385ede1dc7ee893015aea9c6dbaf
  LIBUSB_VERSION: 1.0.30
  TARGET: x86_64-pc-windows-gnu

jobs:
  build-catserver:
    name: Build Catserver
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/iarc-il/catserver-ci:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup SSH
        if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')
        run: |
          export HOME=/root
          mkdir -p $HOME/.ssh
          chmod 700 $HOME/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > $HOME/.ssh/id_rsa
          chmod 600 $HOME/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST_DEV }}" >> $HOME/.ssh/known_hosts
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST_PROD }}" >> $HOME/.ssh/known_hosts
          chmod 644 $HOME/.ssh/known_hosts

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ env.TARGET }}-${{ hashFiles('catserver/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.TARGET }}-

      - name: Cache Hamlib source and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            catserver/${{ env.CARGO_TARGET_DIR }}/hamlib-src
            catserver/${{ env.CARGO_TARGET_DIR }}/**/build/hamlib-src-*/out
          key: ${{ runner.os }}-hamlib-${{ env.HAMLIB_VERSION }}-${{ env.HAMLIB_SHA256 }}-libusb-${{ env.LIBUSB_VERSION }}-${{ env.LIBUSB_SHA256 }}-${{ env.TARGET }}-${{ hashFiles('catserver/Cargo.lock', 'catserver/Cargo.toml', 'catserver/build.rs', 'catserver/crates/hamlib-src/**') }}

      - name: Fix git errors
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --tags --force

      - name: Run rustfmt
        working-directory: catserver
        run: cargo fmt --check

      - name: Verify Hamlib build toolchain
        run: |
          test "$CATSERVER_CI_TOOLCHAIN_CONTRACT" = "hamlib-4.7.2-libusb-1.0.30"
          autoconf --version
          automake --version
          libtool --version
          make --version
          pkg-config --version
          pkg-config --modversion libusb-1.0
          gcc --version
          x86_64-w64-mingw32-gcc --version
          x86_64-w64-mingw32-g++ --version
          x86_64-w64-mingw32-ar --version
          x86_64-w64-mingw32-dlltool --version
          x86_64-w64-mingw32-objdump --version
          x86_64-w64-mingw32-ranlib --version
          x86_64-w64-mingw32-strip --version
          x86_64-w64-mingw32-windres --version
          test -f "$HAMLIB_LIBUSB_INCLUDE_DIR/libusb-1.0/libusb.h"
          test -f "$HAMLIB_LIBUSB_LIB_DIR/libusb-1.0.dll.a"
          test -f "$(dirname "$HAMLIB_LIBUSB_LIB_DIR")/bin/libusb-1.0.dll"
          PKG_CONFIG_LIBDIR="$HAMLIB_LIBUSB_LIB_DIR/pkgconfig" PKG_CONFIG_PATH= pkg-config --modversion libusb-1.0

      - name: Run host workspace tests
        working-directory: ./catserver
        run: cargo test --workspace

      - name: Run Clippy
        working-directory: ./catserver
        run: cargo clippy --workspace --target $TARGET -- -D warnings

      - name: Build development catserver
        if: github.ref == 'refs/heads/dev'
        working-directory: ./catserver
        run: cargo build --workspace --target $TARGET --release

      - name: Build production catserver
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: ./catserver
        run: cargo build --workspace --target $TARGET --release

      - name: Change build artifacts ownership
        if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')
        working-directory: ./catserver
        run: chown -R wix:wix target

      - name: Build installer
        if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')
        working-directory: ./catserver
        run: su wix -c "./build_msi.sh in-docker --default-shortcut-arguments '${DEFAULT_SHORTCUT_ARGUMENTS}'"
        env:
          DEFAULT_SHORTCUT_ARGUMENTS: ${{ github.ref == 'refs/heads/dev' && '--dev-server' || '' }}

      - name: Upload to Development Server
        if: github.ref == 'refs/heads/dev'
        run: |
          bash catserver/publish.sh \
            --deploy-user ${{ secrets.DEPLOY_USER_DEV }} \
            --deploy-host ${{ secrets.DEPLOY_HOST_DEV }} \
            --local-msi-path catserver/target/$TARGET/release/HolyCluster.msi \
            --remote-msi-dir /opt/msi

      - name: Upload to Production Server
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          bash catserver/publish.sh \
            --deploy-user ${{ secrets.DEPLOY_USER_PROD }} \
            --deploy-host ${{ secrets.DEPLOY_HOST_PROD }} \
            --local-msi-path catserver/target/$TARGET/release/HolyCluster.msi \
            --remote-msi-dir /opt/msi
