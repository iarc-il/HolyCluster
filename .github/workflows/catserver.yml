name: Build and upload catserve

on:
  push:
    paths:
      - "catserver/**"
      - ".github/workflows/catserver.yml"
    branches:
      - "dev"
    tags:
      - "catserver-v*"
  pull_request:
    paths:
      - "catserver/**"
      - ".github/workflows/catserver.yml"
    branches:
      - "dev"

env:
  CARGO_TARGET_DIR: target
  TARGET: x86_64-pc-windows-gnu
  CATSERVER_SENTRY_ENVIRONMENT: ${{ github.ref == 'refs/heads/dev' && 'dev' || github.ref_type == 'tag' && 'prod' || 'dev' }}
  CATSERVER_SENTRY_DSN: ${{ vars.CATSERVER_SENTRY_DSN }}
  # Development builds favor CI speed; production tags keep maximum optimization.
  CARGO_PROFILE_RELEASE_LTO: ${{ github.ref_type == 'tag' && 'true' || 'false' }}
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ github.ref_type == 'tag' && '1' || '16' }}
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

concurrency:
  group: catserver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-catserver:
    name: Test Catserver
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/iarc-il/catserver-ci:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install Linux build dependencies
        run: apt-get update && apt-get install --yes libudev-dev

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ env.TARGET }}-${{ hashFiles('catserver/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.TARGET }}-

      - name: Cache Hamlib source and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            catserver/${{ env.CARGO_TARGET_DIR }}/hamlib-src
            catserver/${{ env.CARGO_TARGET_DIR }}/**/build/hamlib-src-*/out
          key: ${{ runner.os }}-hamlib-static-${{ env.TARGET }}-${{ hashFiles('catserver/Cargo.lock', 'catserver/Cargo.toml', 'catserver/.cargo/config.toml', 'catserver/Dockerfile', 'catserver/build.rs', 'catserver/crates/hamlib-src/**') }}

      - name: Fix git errors
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --tags --force

      - name: Run rustfmt
        working-directory: catserver
        run: cargo fmt --check

      - name: Run host workspace tests
        working-directory: catserver
        run: cargo test --workspace

      - name: Test release publisher
        run: python3 catserver/test_publish.py

  lint-catserver:
    name: Lint Catserver
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/iarc-il/catserver-ci:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ env.TARGET }}-${{ hashFiles('catserver/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.TARGET }}-

      - name: Cache Hamlib source and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            catserver/${{ env.CARGO_TARGET_DIR }}/hamlib-src
            catserver/${{ env.CARGO_TARGET_DIR }}/**/build/hamlib-src-*/out
          key: ${{ runner.os }}-hamlib-static-${{ env.TARGET }}-${{ hashFiles('catserver/Cargo.lock', 'catserver/Cargo.toml', 'catserver/.cargo/config.toml', 'catserver/Dockerfile', 'catserver/build.rs', 'catserver/crates/hamlib-src/**') }}

      - name: Fix git errors
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --tags --force

      - name: Run Clippy
        working-directory: catserver
        run: cargo clippy --workspace --target $TARGET -- -D warnings

  build-linux:
    name: Build Linux Catserver
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/iarc-il/catserver-ci:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install Linux build dependencies
        run: apt-get update && apt-get install --yes libudev-dev

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ env.TARGET }}-${{ hashFiles('catserver/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.TARGET }}-

      - name: Cache Hamlib source and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            catserver/${{ env.CARGO_TARGET_DIR }}/hamlib-src
            catserver/${{ env.CARGO_TARGET_DIR }}/**/build/hamlib-src-*/out
          key: ${{ runner.os }}-hamlib-static-${{ env.TARGET }}-${{ hashFiles('catserver/Cargo.lock', 'catserver/Cargo.toml', 'catserver/.cargo/config.toml', 'catserver/Dockerfile', 'catserver/build.rs', 'catserver/crates/hamlib-src/**') }}

      - name: Fix git errors
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --tags --force

      - name: Build Linux release binary
        working-directory: catserver
        run: cargo build --workspace --target x86_64-unknown-linux-gnu --release

      - name: Build Linux AppImage
        working-directory: catserver
        run: sh ./build_appimage.sh

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: HolyCluster-linux-x86_64
          path: catserver/target/x86_64-unknown-linux-gnu/release/catserver-v*-linux-x86_64.AppImage

  build-windows:
    name: Build Windows Catserver
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/iarc-il/catserver-ci:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ env.TARGET }}-${{ hashFiles('catserver/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.TARGET }}-

      - name: Cache Hamlib source and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            catserver/${{ env.CARGO_TARGET_DIR }}/hamlib-src
            catserver/${{ env.CARGO_TARGET_DIR }}/**/build/hamlib-src-*/out
          key: ${{ runner.os }}-hamlib-static-${{ env.TARGET }}-${{ hashFiles('catserver/Cargo.lock', 'catserver/Cargo.toml', 'catserver/.cargo/config.toml', 'catserver/Dockerfile', 'catserver/build.rs', 'catserver/crates/hamlib-src/**') }}

      - name: Fix git errors
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --tags --force

      - name: Build static catserver
        working-directory: catserver
        run: cargo build --workspace --target $TARGET --release

      - name: Reject non-system DLL imports
        working-directory: catserver
        run: |
          imports=$(x86_64-w64-mingw32-objdump -p target/$TARGET/release/catserver.exe | awk '/DLL Name:/ { print tolower($3) }')
          for dll in $imports; do
            case "$dll" in
              advapi32.dll|bcrypt.dll|bcryptprimitives.dll|cfgmgr32.dll|combase.dll|comctl32.dll|comdlg32.dll|crypt32.dll|dwmapi.dll|gdi32.dll|hid.dll|imm32.dll|iphlpapi.dll|kernel32.dll|kernelbase.dll|mpr.dll|msvcrt.dll|ncrypt.dll|ntdll.dll|ole32.dll|oleaut32.dll|propsys.dll|rpcrt4.dll|secur32.dll|setupapi.dll|shell32.dll|shlwapi.dll|user32.dll|uxtheme.dll|userenv.dll|uuid.dll|version.dll|winhttp.dll|winmm.dll|winspool.drv|winusb.dll|ws2_32.dll|wtsapi32.dll|api-ms-win-*.dll|ext-ms-win-*.dll) ;;
              *) echo "non-system DLL import: $dll" >&2; exit 1 ;;
            esac
          done

      - name: Change build artifacts ownership
        if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')
        working-directory: catserver
        run: chown -R wix:wix target

      - name: Build installer
        if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')
        working-directory: catserver
        run: su wix -c "./build_msi.sh in-docker --default-shortcut-arguments '${DEFAULT_SHORTCUT_ARGUMENTS}'"
        env:
          DEFAULT_SHORTCUT_ARGUMENTS: ${{ github.ref == 'refs/heads/dev' && '--dev-server' || '' }}

      - name: Upload Windows MSI
        if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: HolyCluster-windows-x86_64
          path: catserver/target/${{ env.TARGET }}/release/HolyCluster.msi

  publish-catserver:
    name: Publish Catserver
    if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')
    needs: [test-catserver, lint-catserver, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: HolyCluster-linux-x86_64
          path: catserver/target/x86_64-unknown-linux-gnu/release

      - name: Download Windows MSI
        uses: actions/download-artifact@v4
        with:
          name: HolyCluster-windows-x86_64
          path: catserver/target/${{ env.TARGET }}/release

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST_DEV }}" >> ~/.ssh/known_hosts
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST_PROD }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload to Development Server
        if: github.ref == 'refs/heads/dev'
        run: |
          VERSION="$(git describe --match 'catserver-v*')"
          python3 catserver/publish.py \
            --deploy-user ${{ secrets.DEPLOY_USER_DEV }} \
            --deploy-host ${{ secrets.DEPLOY_HOST_DEV }} \
            --remote-artifact-dir /opt/msi \
            --version "$VERSION" \
            --artifact "windows:x86_64:catserver/target/$TARGET/release/HolyCluster.msi:$VERSION-windows-x86_64.msi" \
            --artifact "linux:x86_64:catserver/target/x86_64-unknown-linux-gnu/release/$VERSION-linux-x86_64.AppImage:$VERSION-linux-x86_64.AppImage"

      - name: Upload to Production Server
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(git describe --match 'catserver-v*')"
          python3 catserver/publish.py \
            --deploy-user ${{ secrets.DEPLOY_USER_PROD }} \
            --deploy-host ${{ secrets.DEPLOY_HOST_PROD }} \
            --remote-artifact-dir /opt/msi \
            --version "$VERSION" \
            --artifact "windows:x86_64:catserver/target/$TARGET/release/HolyCluster.msi:$VERSION-windows-x86_64.msi" \
            --artifact "linux:x86_64:catserver/target/x86_64-unknown-linux-gnu/release/$VERSION-linux-x86_64.AppImage:$VERSION-linux-x86_64.AppImage"
