name: Build and Deploy the UI

on:
  push:
    paths:
      - "ui/**"
      - ".github/workflows/ui.yml"
    branches:
      - "dev"
      - "int"
    tags:
      - "v*"
  pull_request:
    paths:
      - "ui/**"
      - ".github/workflows/ui.yml"
    branches:
      - "dev"
      - "int"

jobs:
  build-and-deploy-ui:
    name: Build, Lint, and Deploy the UI
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/int' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: |
          cd ui
          npm ci

      - name: Run Biome formatting check
        run: |
          cd ui
          npx biome check .

      - name: Run tests
        run: |
          cd ui
          npm test

      - name: Set Sentry build metadata
        env:
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          echo "SENTRY_RELEASE=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "VITE_SENTRY_RELEASE=${GITHUB_SHA}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "VITE_SENTRY_ENVIRONMENT=prod" >> "$GITHUB_ENV"
          else
            echo "VITE_SENTRY_ENVIRONMENT=dev" >> "$GITHUB_ENV"
          fi
          echo "SENTRY_PROJECT=$SENTRY_PROJECT" >> "$GITHUB_ENV"
          echo "VITE_SENTRY_DSN=$SENTRY_DSN" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == "refs/heads/dev" || "$GITHUB_REF" == refs/tags/* ]]; then
            echo "GLITCHTIP_UPLOAD_SOURCE_MAPS=true" >> "$GITHUB_ENV"
          else
            echo "GLITCHTIP_UPLOAD_SOURCE_MAPS=false" >> "$GITHUB_ENV"
          fi

      - name: Build React App
        run: |
          cd ui
          npm run build

      - name: Install GlitchTip CLI
        if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')
        run: |
          curl --fail --location --silent --show-error \
            'https://gitlab.com/glitchtip/glitchtip-cli/-/jobs/artifacts/v1.0.0/raw/artifacts/glitchtip-cli-linux-x86_64?job=build-linux-x86_64' \
            --output "$RUNNER_TEMP/glitchtip-cli"
          echo "de1c035aa61931a6265d7b29b1614781dfee925466142a907508cb097082dfef  $RUNNER_TEMP/glitchtip-cli" | sha256sum --check --status
          chmod 755 "$RUNNER_TEMP/glitchtip-cli"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Upload source maps
        if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_URL: https://holycluster-dev.iarc.org/errors
        run: |
          glitchtip-cli releases new "$SENTRY_RELEASE" --finalize
          glitchtip-cli sourcemaps inject ui/dist
          glitchtip-cli sourcemaps upload --release "$SENTRY_RELEASE" --validate ui/dist

      - name: Remove source maps before deployment
        if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')
        run: |
          shopt -s globstar nullglob
          rm -f ui/dist/**/*.map

      - name: Setup SSH
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/int' || startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST_DEV }} >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST_INT }} >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST_PROD }} >> ~/.ssh/known_hosts

      - name: Upload to Development Server
        if: github.ref == 'refs/heads/dev'
        run: |
          rsync -avz --delete ui/dist/ ${{ secrets.DEPLOY_USER_DEV }}@${{ secrets.DEPLOY_HOST_DEV }}:${{ secrets.DEPLOY_PATH_DEV }}/

      - name: Upload to Integration Server
        if: github.ref == 'refs/heads/int'
        run: |
          rsync -avz --delete ui/dist/ ${{ secrets.DEPLOY_USER_INT }}@${{ secrets.DEPLOY_HOST_INT }}:${{ secrets.DEPLOY_PATH_INT }}/

      - name: Upload to Production Server
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          rsync -avz --delete ui/dist/ ${{ secrets.DEPLOY_USER_PROD }}@${{ secrets.DEPLOY_HOST_PROD }}:${{ secrets.DEPLOY_PATH_PROD }}/
